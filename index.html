<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>РОМАН: Лобби</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="lobby">
<div id="lobbyBox">
  <div id="lobbyTitle">РОМАН<span>ПИКСЕЛЬНОЕ ПРИКЛЮЧЕНИЕ</span></div>
  <div class="lobbySub">СОЛО ИЛИ КООП ДО 5 ИГРОКОВ · P2P ПО КОДУ КОМНАТЫ</div>
  <button class="btn" id="btnSolo">&#9654; ОДИНОЧНАЯ ИГРА</button>
  <button class="btn" id="btnHost">&#8962; СОЗДАТЬ КОМНАТУ</button>
  <div class="joinRow">
    <input id="codeIn" maxlength="6" placeholder="КОД" autocomplete="off" spellcheck="false">
    <button class="btn" id="btnJoin">&#8594; ВОЙТИ</button>
  </div>
  <div id="lobbyMsg"></div>
  <div class="lobbyHint">
    Комната живёт в браузере хоста &middot; WebRTC + MQTT<br>
    Вкладки одного браузера соединяются без интернета<br>
    Общий мир: враги, сферы, квесты и HP — у всех одни<br>
    Закрытые корпоративные NAT могут блокировать прямое P2P-соединение
  </div>
</div>
<script>
(function () {
  var AL = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function gen() {
    var a = new Uint8Array(6), s = '', i;
    try { crypto.getRandomValues(a); }
    catch (e) { for (i = 0; i < 6; i++) a[i] = (Math.random() * 256) | 0; }
    for (i = 0; i < 6; i++) s += AL[a[i] % AL.length];
    return s;
  }
  function go(u) { location.href = u; }
  var msg = document.getElementById('lobbyMsg');
  document.getElementById('btnSolo').onclick = function () { go('game.html'); };
  document.getElementById('btnHost').onclick = function () { go('game.html?host=' + gen()); };
  var inp = document.getElementById('codeIn');
  function join() {
    var c = (inp.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    if (c.length !== 6) { msg.textContent = 'Введите код комнаты из 6 символов'; inp.focus(); return; }
    go('game.html?join=' + c);
  }
  document.getElementById('btnJoin').onclick = join;
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') join(); });
  inp.addEventListener('input', function () {
    inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  });
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('err')) { msg.textContent = q.get('err'); inp.focus(); }
  } catch (e) { }
})();
</script>
</body>
</html>
